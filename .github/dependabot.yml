# Dependency updates.
#
# One pull request a week, for all of it: the crates and the workflows'
# actions arrive together, reviewed and merged once. What must not move with
# the rest is in its ecosystem's ignore.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday

updates:
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      # Bevy is pre-1.0: every minor version breaks, and games pin the Bevy
      # they build on. An upgrade is a release of its own, by hand - see
      # "Upgrading Bevy" in AGENTS.md.
      - dependency-name: bevy
        update-types: [version-update:semver-minor, version-update:semver-major]

  # The easiest supply-chain gap to forget: an action pinned to a tag that
  # quietly stops being maintained.
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
