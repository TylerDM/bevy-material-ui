name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

concurrency:
  # A new push to the same branch cancels the in-flight run for the old commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only cost disk on a runner that starts empty.
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Formatting, lints and docs: once, on Linux. The lints are the same on
  # every platform; the code that differs by platform is Bevy's, not ours.
  # ---------------------------------------------------------------------------
  lint:
    name: Format, clippy & docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml names the channel and components; rustup, already
      # on the runner, installs them on first use.
      - name: Set up Rust
        run: rustup show

      - name: Install Linux libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy, without Roboto
        run: cargo clippy --lib --no-default-features -- -D warnings

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # ---------------------------------------------------------------------------
  # The tests, on all three desktops: a game on this crate ships to each, and
  # the tests need no window or GPU (`bevy_material_ui::testing`).
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup show

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-features

      # The play test as a game builds it: the window, the renderer, the lot.
      - name: Build the play test
        run: cargo build --example playtest
